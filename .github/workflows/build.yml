name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Dylib with Clang
      run: |
        clang -dynamiclib \
        -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
        -arch arm64 \
        Speedhack.m \
        -framework Foundation -framework CoreFoundation -framework UIKit \
        -o Speedhack.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Speedhack-Dylib
        path: Speedhack.dylib
